<section id="ternos" class="suits section theme-dark" data-bg="dark" aria-labelledby="suits-title">
  <div class="container suits__grid">
    <figure class="suits__figure">
      <div class="media suits__media" appImageMask>
        <img
          appImageZoom="in"
          [ngSrc]="s.photo.src"
          fill
          sizes="(min-width: 992px) 45vw, 92vw"
          [alt]="s.photo.alt"
        />
      </div>

      <!-- Pontos pulsantes sobre a foto (A28 initPins + A36 dicas flutuantes do clone) -->
      <ul
        class="hotspots"
        role="list"
        aria-label="Detalhes do terno na foto"
        appReveal="fade"
        [revealDelay]="1.3"
      >
        @for (h of s.hotspots; track h.label; let i = $index) {
          <li
            class="hotspot"
            [style.left.%]="h.x"
            [style.top.%]="h.y"
            [class.is-open]="openHotspot() === i"
            [class.is-left]="h.x > 65"
          >
            <button
              type="button"
              class="hotspot__btn"
              [attr.aria-expanded]="openHotspot() === i"
              [attr.aria-describedby]="'suits-hotspot-' + i"
              (click)="toggleHotspot(i)"
            >
              <span class="visually-hidden">{{ h.label }}</span>
              <span class="hotspot__pulse" aria-hidden="true"></span>
              <span class="hotspot__pulse hotspot__pulse--b" aria-hidden="true"></span>
              <span class="hotspot__dot" aria-hidden="true"><app-icon name="plus" /></span>
            </button>
            <span class="hotspot__tip" role="tooltip" [id]="'suits-hotspot-' + i">
              <strong class="label">{{ h.label }}</strong>
              <span>{{ h.text }}</span>
            </span>
          </li>
        }
      </ul>
    </figure>

    <div class="suits__body">
      <div class="section-head">
        <p class="eyebrow" appReveal="fade">{{ s.eyebrow }}</p>
        <h2 id="suits-title" class="h2 section-title">
          <span appSplitText="chars">{{ s.title[0] }}</span>
          <span appSplitText="chars" [splitIndex]="2">{{ s.title[1] }}</span>
        </h2>
        <p class="lead muted suits__text" appSplitText="lines" [splitDelay]="0.2">{{ s.text }}</p>
      </div>

      <div appReveal="ctn" [revealDelay]="0.2">
        <app-option-tabs
          [options]="s.options"
          label="Personalização do terno"
          idPrefix="suits-options"
        />
      </div>

      <a
        class="btn btn--ghost suits__cta"
        appAnchor="#agendar"
        href="#agendar"
        appReveal="ctn"
        [revealDelay]="0.3"
      >
        {{ ctaLabel }}
        <app-icon name="arrow-right" />
      </a>
    </div>
  </div>
</section>
